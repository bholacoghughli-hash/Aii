name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Locate Project & Create Wrapper
        run: |
          TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1))
          echo "Found project at: $TARGET_DIR"
          cd "$TARGET_DIR"
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          echo "PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd $PROJECT_PATH
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
