name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Auto Fix & Patch All Dependencies
        run: |
          python3 -c '
          import os, zipfile, glob, re

          # 1. Unzip if archive present
          for zip_path in glob.glob("**/*.zip", recursive=True):
              print(f"Extracting {zip_path}...")
              with zipfile.ZipFile(zip_path, "r") as z:
                  z.extractall(".")

          # 2. Find Root
          project_dir = "."
          for root, dirs, files in os.walk("."):
              if "settings.gradle.kts" in files or "settings.gradle" in files:
                  project_dir = root
                  break

          print(f"Android Project: {project_dir}")

          # 3. Create .env
          with open(os.path.join(project_dir, ".env"), "w") as f:
              f.write("GEMINI_API_KEY=MY_GEMINI_API_KEY\n")

          # 4. Patch gradle.properties
          gp_file = os.path.join(project_dir, "gradle.properties")
          if os.path.exists(gp_file):
              with open(gp_file, "r") as f:
                  gp = f.read()
              gp = gp.replace("org.gradle.configuration-cache=true", "org.gradle.configuration-cache=false")
              with open(gp_file, "w") as f:
                  f.write(gp)

          # 5. Fix libs.versions.toml (Room 2.6.1 stable, AGP 8.7.3)
          for root, dirs, files in os.walk(project_dir):
              for f in files:
                  if f == "libs.versions.toml":
                      toml_path = os.path.join(root, f)
                      with open(toml_path, "r") as r:
                          c = r.read()
                      c = re.sub(r"agp\s*=\s*\"[^\"]+\"", "agp = \"8.7.3\"", c)
                      c = re.sub(r"roomRuntime\s*=\s*\"[^\"]+\"", "roomRuntime = \"2.6.1\"", c)
                      c = re.sub(r"roomKtx\s*=\s*\"[^\"]+\"", "roomKtx = \"2.6.1\"", c)
                      c = re.sub(r"roomCompiler\s*=\s*\"[^\"]+\"", "roomCompiler = \"2.6.1\"", c)
                      with open(toml_path, "w") as w:
                          w.write(c)

          # 6. Overwrite app/build.gradle.kts
          app_bg = """import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy

          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.google.devtools.ksp)
              alias(libs.plugins.roborazzi)
              alias(libs.plugins.secrets)
              alias(libs.plugins.google.services)
          }

          android {
              namespace = "com.example"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.aistudio.aicreatorstudio.bhskr"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      isCrunchPngs = false
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isDebuggable = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              testOptions {
                  unitTests {
                      isIncludeAndroidResources = true
                  }
              }
          }

          secrets {
              propertiesFileName = ".env"
              defaultPropertiesFileName = ".env.example"
              ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
          }

          googleServices {
              missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN
          }

          dependencies {
              implementation(platform(libs.androidx.compose.bom))
              implementation(platform(libs.firebase.bom))
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.compose.material.icons.core)
              implementation(libs.androidx.compose.material.icons.extended)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.lifecycle.runtime.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.room.ktx)
              implementation(libs.androidx.room.runtime)
              implementation(libs.coil.compose)
              implementation(libs.converter.moshi)
              implementation(libs.firebase.ai)
              implementation(libs.firebase.appcheck.recaptcha)
              implementation(libs.kotlinx.coroutines.android)
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.logging.interceptor)
              implementation(libs.moshi.kotlin)
              implementation(libs.okhttp)
              implementation(libs.retrofit)
              
              debugImplementation(libs.androidx.compose.ui.test.manifest)
              debugImplementation(libs.androidx.compose.ui.tooling)
              
              "ksp"(libs.androidx.room.compiler)
              "ksp"(libs.moshi.kotlin.codegen)
          }
          """
          with open(os.path.join(project_dir, "app", "build.gradle.kts"), "w") as w:
              w.write(app_bg)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_ROOT={os.path.abspath(project_dir)}\n")
          '

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
