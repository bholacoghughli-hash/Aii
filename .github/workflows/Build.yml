name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Unpack & Configure Project
        run: |
          mkdir -p project_root
          # Agar zip file hai to extract karein
          ZIP_NAME=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            echo "Extracting: $ZIP_NAME"
            unzip -q -o "$ZIP_NAME" -d project_root/
          else
            echo "No zip file found, copying root files..."
            cp -r !(project_root) project_root/ 2>/dev/null || true
          fi

          # Target settings file dhoondein
          TARGET_SETTINGS=$(find project_root/ -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$TARGET_SETTINGS" ]; then
            echo "Listing repository content:"
            ls -la
            echo "Error: Android project files nahi mile!"
            exit 1
          fi

          WORK_DIR=$(dirname "$TARGET_SETTINGS")
          echo "Building in: $WORK_DIR"
          cd "$WORK_DIR"

          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          echo "PROJECT_DIR=$WORK_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
