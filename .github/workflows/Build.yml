name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Unzip & Prepare Android Project
        run: |
          # Agar zip file repository me hai to use extract karein
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE" -d ./extracted_project
          fi

          # settings.gradle ya settings.gradle.kts dhoondein
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Android project files not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Target project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          echo "PROJECT_PATH=$(pwd)" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_PATH"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
