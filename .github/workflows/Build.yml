name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Unpack and Repair Project
        run: |
          # 1. Unzip if needed
          for zip in $(find . -name "*.zip"); do
            unzip -q -o "$zip" -d .
          done

          # 2. Find Android Project Root
          PROJECT_ROOT=$(dirname $(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1))
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          cd "$PROJECT_ROOT"

          # 3. Create .env file
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env

          # 4. Disable Configuration Cache in gradle.properties
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties 2>/dev/null || true

          # 5. Fix AGP Version in libs.versions.toml
          sed -i 's/agp = ".*"/agp = "8.8.2"/g' gradle/libs.versions.toml 2>/dev/null || true

          # 6. Overwrite app/build.gradle.kts with Clean Syntax
          cat << 'EOF' > app/build.gradle.kts
          import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy

          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.google.devtools.ksp)
              alias(libs.plugins.roborazzi)
              alias(libs.plugins.secrets)
              alias(libs.plugins.google.services)
          }

          android {
              namespace = "com.example"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.aistudio.aicreatorstudio.bhskr"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      isCrunchPngs = false
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isDebuggable = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              testOptions {
                  unitTests {
                      isIncludeAndroidResources = true
                  }
              }
          }

          secrets {
              propertiesFileName = ".env"
              defaultPropertiesFileName = ".env.example"
              ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
          }

          googleServices {
              missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN
          }

          dependencies {
              implementation(platform(libs.androidx.compose.bom))
              implementation(platform(libs.firebase.bom))
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.compose.material.icons.core)
              implementation(libs.androidx.compose.material.icons.extended)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.lifecycle.runtime.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.room.ktx)
              implementation(libs.androidx.room.runtime)
              implementation(libs.coil.compose)
              implementation(libs.converter.moshi)
              implementation(libs.firebase.ai)
              implementation(libs.firebase.appcheck.recaptcha)
              implementation(libs.kotlinx.coroutines.android)
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.logging.interceptor)
              implementation(libs.moshi.kotlin)
              implementation(libs.okhttp)
              implementation(libs.retrofit)
              
              debugImplementation(libs.androidx.compose.ui.test.manifest)
              debugImplementation(libs.androidx.compose.ui.tooling)
              
              "ksp"(libs.androidx.room.compiler)
              "ksp"(libs.moshi.kotlin.codegen)
          }
          EOF

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
