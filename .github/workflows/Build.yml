name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Extract and Setup Project
        run: |
          python3 -c '
          import os, zipfile, glob

          # Extract any zip file found
          for zip_path in glob.glob("**/*.zip", recursive=True):
              print(f"Extracting {zip_path}...")
              with zipfile.ZipFile(zip_path, "r") as z:
                  z.extractall("extracted_project")

          # Find where settings.gradle / settings.gradle.kts is
          project_dir = "."
          for root, dirs, files in os.walk("."):
              if "settings.gradle.kts" in files or "settings.gradle" in files:
                  project_dir = root
                  break

          print(f"Found project at: {project_dir}")
          env_file = os.path.join(project_dir, ".env")
          with open(env_file, "w") as f:
              f.write("GEMINI_API_KEY=MY_GEMINI_API_KEY\n")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={os.path.abspath(project_dir)}\n")
          '

      - name: Create Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
